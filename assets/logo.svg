<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5a4"/>
    </linearGradient>
  </defs>

  <!-- Icon: phone with wrench -->
  <g transform="translate(200,120)">
    <!-- phone body -->
    <rect x="0" y="0" width="240" height="440" rx="28" fill="#0f172a"/>
    <!-- screen -->
    <rect x="18" y="18" width="204" height="380" rx="16" fill="#071025"/>
    <!-- speaker -->
    <rect x="86" y="12" width="68" height="6" rx="3" fill="#1e293b"/>
    <!-- home button -->
    <circle cx="120" cy="430" r="8" fill="#1e293b"/>
  </g>

  <!-- wrench overlay (icon mark) -->
  <g transform="translate(390,260) rotate(20)">
    <path d="M-60-20c-3-3-8-3-11 0l-22 22c-3 3-3 8 0 11l28 28c3 3 8 3 11 0l22-22c3-3 3-8 0-11l-28-28z" fill="url(#g1)"/>
    <rect x="-36" y="14" width="56" height="16" rx="6" fill="url(#g1)" transform="rotate(-15 -8 22)"/>
  </g>

  <!-- Text: Goiye's IT Services -->
  <text x="400" y="640" text-anchor="middle" font-family="Segoe UI, Roboto, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial" font-size="48" fill="#0f172a">Goiye's</text>
  <text x="400" y="700" text-anchor="middle" font-family="Segoe UI, Roboto, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial" font-size="28" fill="#64748b">IT Services</text>
</svg>
